<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collagent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg stroke='%23ff875f' stroke-width='1.8'%3E%3Cpath d='M12 13 5.5 5M12 13l6.5-8M12 13v8'/%3E%3C/g%3E%3Ccircle cx='5.5' cy='5' r='2.4' fill='%23e6e6ea'/%3E%3Ccircle cx='18.5' cy='5' r='2.4' fill='%23e6e6ea'/%3E%3Ccircle cx='12' cy='21' r='2.4' fill='%23e6e6ea'/%3E%3Ccircle cx='12' cy='13' r='3' fill='%23ff875f'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #101014; color: #e6e6ea;
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid #26262e;
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
  }
  header h1 {
    font-size: 14px; margin: 0; color: #f0eef4; letter-spacing: .5px;
    display: flex; align-items: center; gap: 8px;
  }
  header h1 .mark { width: 17px; height: 17px; flex: none; }
  #presence { display: flex; gap: 12px; flex-wrap: wrap; color: #9a9aa5; }
  #presence .on::before { content: "● "; color: #5ad48a; }
  #presence .off::before { content: "○ "; color: #55555f; }
  #presence .agent svg { width: 14px; height: 14px; vertical-align: -2px; margin-right: 5px; }
  #join { display: flex; gap: 8px; padding: 24px 16px; }
  input, button {
    background: #1a1a21; color: inherit; border: 1px solid #33333d;
    border-radius: 6px; padding: 8px 10px; font: inherit;
  }
  button { cursor: pointer; background: #2c2440; border-color: #4b3a75; }
  #feed { flex: 1; overflow-y: auto; padding: 12px 16px; }
  #feed div { white-space: pre-wrap; word-break: break-word; margin: 2px 0; }
  .dim { color: #71717c; } .user { color: #7cc7ff; } .agent-msg { color: #d6c7ff; }
  .tool { color: #e0c368; } .ok { color: #5ad48a; } .err { color: #ff7a7a; }
  #composer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #26262e; }
  #composer input { flex: 1; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>
    <!-- The Collagent mark: three participant nodes joined at one hub. -->
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
      <g stroke="#ff875f" stroke-width="1.8"><path d="M12 13 5.5 5M12 13l6.5-8M12 13v8"/></g>
      <circle cx="5.5" cy="5" r="2.4" fill="#e6e6ea"/>
      <circle cx="18.5" cy="5" r="2.4" fill="#e6e6ea"/>
      <circle cx="12" cy="21" r="2.4" fill="#e6e6ea"/>
      <circle cx="12" cy="13" r="3" fill="#ff875f"/>
    </svg>
    collagent
  </h1>
  <span id="sessioninfo" class="dim"></span>
  <div id="presence"></div>
</header>

<div id="join">
  <input id="code" placeholder="session code (e.g. 7FK2P)" maxlength="8" autocapitalize="characters">
  <input id="name" placeholder="your name">
  <button id="joinBtn">Join session</button>
</div>

<div id="feed" class="hidden"></div>
<div id="composer" class="hidden">
  <input id="text" placeholder="send an instruction — /commands run in the shared agent…">
  <button id="sendBtn">Send</button>
</div>

<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
if (params.get('code')) $('code').value = params.get('code');

let ws, self = null, session = null;

$('joinBtn').onclick = join;
$('code').onkeydown = (e) => e.key === 'Enter' && join();
$('name').onkeydown = (e) => e.key === 'Enter' && join();
$('sendBtn').onclick = send;
$('text').onkeydown = (e) => e.key === 'Enter' && send();

async function join() {
  const code = $('code').value.trim().toUpperCase();
  const name = $('name').value.trim() || 'web-viewer';
  let key = params.get('key');
  if (!code) return;

  if (!key) {
    try {
      const res = await fetch('/api/sessions/' + code);
      if (res.ok) key = (await res.json()).joinKey ?? null;
    } catch {}
  }
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => ws.send(JSON.stringify({ type: 'join', code, name, key }));
  ws.onmessage = (m) => handle(JSON.parse(m.data));
  ws.onclose = () => addLine('connection closed', 'err');
}

function handle(msg) {
  if (msg.type === 'welcome') {
    self = msg.self; session = msg.session;
    $('join').classList.add('hidden');
    $('feed').classList.remove('hidden');
    $('composer').classList.remove('hidden');
    renderSession();
    for (const e of msg.events) renderEvent(e);
  } else if (msg.type === 'event') {
    renderEvent(msg.event);
  } else if (msg.type === 'session') {
    session = msg.session; renderSession();
  } else if (msg.type === 'error') {
    addLine('error: ' + msg.message, 'err');
  }
}

// Rooms store adapter ids; people should read runtime brands.
const AGENT_LABELS = {
  'claude-native': 'Claude Code', 'claude-code': 'Claude Code',
  'codex-native': 'Codex', codex: 'Codex',
  'cursor-native': 'Cursor', cursor: 'Cursor',
  'gemini-native': 'Gemini CLI', gemini: 'Gemini CLI',
  'opencode-native': 'OpenCode', opencode: 'OpenCode',
  'goose-native': 'Goose', goose: 'Goose', mock: 'Mock agent',
};
const agentLabel = () =>
  (session && (AGENT_LABELS[session.agentType] || session.agentType)) || 'agent';

// Vendor marks: Anthropic starburst, OpenAI hexagon, Cursor's isometric cube.
const MARK_CLAUDE = '<svg viewBox="0 0 24 24" fill="none" stroke="#D97757" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/></svg>';
const MARK_CODEX = '<svg viewBox="0 0 24 24" fill="none" stroke="#e6e6ea" stroke-width="2" stroke-linejoin="round"><path d="M12 2.5 20.2 7.25v9.5L12 21.5 3.8 16.75v-9.5z"/></svg>';
const MARK_CURSOR = '<svg viewBox="0 0 24 24" fill="#e6e6ea"><path d="M12 2 21 7v10l-9 5-9-5V7z" opacity=".22"/><path d="M12 2 21 7l-9 5-9-5z" opacity=".95"/><path d="M12 12v10l-9-5V7z" opacity=".55"/></svg>';
const MARK_GEMINI = '<svg viewBox="0 0 24 24" fill="#7C8CF8"><path d="M12 2c.6 5.5 4.5 9.4 10 10-5.5.6-9.4 4.5-10 10-.6-5.5-4.5-9.4-10-10 5.5-.6 9.4-4.5 10-10z"/></svg>';
const MARK_OPENCODE = '<svg viewBox="0 0 24 24" fill="none" stroke="#e6e6ea" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12 15h5"/></svg>';
const MARK_GOOSE = '<svg viewBox="0 0 24 24" fill="#e6e6ea"><path d="M12 2 22 12 12 22 2 12z" opacity=".9"/><path d="M12 7 17 12 12 17 7 12z" fill="#101014"/></svg>';
const AGENT_MARKS = {
  'claude-native': MARK_CLAUDE, 'claude-code': MARK_CLAUDE,
  'codex-native': MARK_CODEX, codex: MARK_CODEX,
  'cursor-native': MARK_CURSOR, cursor: MARK_CURSOR,
  'gemini-native': MARK_GEMINI, gemini: MARK_GEMINI,
  'opencode-native': MARK_OPENCODE, opencode: MARK_OPENCODE,
  'goose-native': MARK_GOOSE, goose: MARK_GOOSE,
};
const agentMark = () => (session && AGENT_MARKS[session.agentType]) || '';

let roomTitle = null;

const multiAgent = () => ((session && session.agents) || []).length > 1;

function renderSession() {
  const online = session.participants.filter((p) => p.connected).length;
  const agents = session.agents || [];
  const agentCell = multiAgent() ? `${agents.length} agents` : agentLabel();
  $('sessioninfo').textContent =
    `room ${session.code} · ${agentCell} · ${session.status}` +
    `${session.mode === 'driver' ? ' · driver mode' : ''} · ${online} ${online === 1 ? 'person' : 'people'} here` +
    (roomTitle ? ` · “${roomTitle}”` : '');
  const el = $('presence');
  el.innerHTML = '';
  for (const p of session.participants) {
    const span = document.createElement('span');
    span.className = p.connected ? 'on' : 'off';
    const marks = [p.role === 'host' && 'host', p.id === session.driverId && 'driver'].filter(Boolean);
    span.textContent = p.name + (marks.length ? ` [${marks.join(',')}]` : '');
    el.appendChild(span);
  }
  if (multiAgent()) {
    for (const a of agents) {
      const span = document.createElement('span');
      span.className = a.attached ? 'agent on' : 'agent off';
      span.textContent = `${a.agentId} [${a.attached ? a.status : 'detached'}]`;
      el.appendChild(span);
    }
  } else {
    const agent = document.createElement('span');
    agent.className = 'agent';
    agent.innerHTML = agentMark(); // our own static markup, never user input
    agent.appendChild(document.createTextNode(agentLabel()));
    el.appendChild(agent);
  }
}

function renderEvent(e) {
  const d = e.data || {}, who = (e.actor && e.actor.name) || '';
  switch (e.kind) {
    case 'session_title':
      if (d.title) { roomTitle = d.title; renderSession(); }
      return;
    case 'instruction':
      if (!roomTitle) { roomTitle = String(d.text || '').slice(0, 60); renderSession(); }
      return addLine(`${who} ›${multiAgent() && e.agentId ? ' → ' + e.agentId : ''} ${d.text}`, 'user');
    case 'local_prompt': return addLine(`⌨ host terminal › ${d.text}`, 'user');
    case 'notice': return addLine(`🔔 ${d.message}`, 'tool');
    case 'agent_message': return addLine(`⏺ ${multiAgent() && e.agentId ? e.agentId + ' ' : ''}${d.text}`, 'agent-msg');
    case 'agent_session_created': return e.actor && e.actor.type === 'system' ? undefined : addLine(`＋ ${e.agentId} added by ${who}`, 'ok');
    case 'agent_session_attached': return addLine(`● ${e.agentId || 'agent'} attached`, 'ok');
    case 'agent_session_detached': return addLine(`○ ${e.agentId || 'agent'} detached — room stays open`, 'dim');
    case 'handoff_completed': return addLine(`⇄ ${who} handed off to ${(d.to && d.to.name) || '?'}`, 'user');
    case 'room_archived': return addLine(`▣ room archived by ${who}`, 'dim');
    case 'turn_started': case 'turn_completed': case 'turn_failed': return;
    case 'tool_use': return addLine(`  ⚙ ${d.tool} ${d.input || ''}`, 'tool');
    case 'tool_result': return addLine(`    └ ${d.summary || ''}`, 'dim');
    case 'result': return addLine(d.ok ? `✓ turn complete${d.durationMs ? ' in ' + (d.durationMs / 1000).toFixed(1) + 's' : ''}` : '✗ turn failed', d.ok ? 'ok' : 'err');
    case 'participant_joined': return addLine(`● ${who} joined`, 'ok');
    case 'participant_left': return addLine(`○ ${who} left`, 'dim');
    case 'participant_disconnected': return addLine(`○ ${who} disconnected`, 'dim');
    case 'participant_reconnected': return addLine(`● ${who} reconnected`, 'ok');
    case 'session_paused': return addLine(`⏸ paused by ${who}`, 'tool');
    case 'session_resumed': return addLine(`▶ resumed by ${who}`, 'ok');
    case 'control_transferred': return addLine(`⇄ control handed to ${d.to && d.to.name}`, 'user');
    case 'mode_changed': return addLine(`⚑ mode: ${d.mode}`, 'user');
    case 'session_ended': return addLine(`■ session ended by ${who}`, 'err');
    case 'room_closed':
      $('composer').classList.add('hidden');
      return addLine(`■ room closed — ${d.reason || 'the host left'} (history saved)`, 'err');
    case 'agent_status':
      if (d.status === 'working') return addLine(`· ${agentLabel()} is working…`, 'dim');
      if (d.status === 'ready') return addLine(`· ${agentLabel()} ready`, 'dim');
      if (d.status === 'exited' || d.status === 'disconnected') return addLine('· agent ' + d.status, 'err');
      return;
    case 'error': return addLine('! ' + d.message, 'err');
    default: return;
  }
}

function addLine(text, cls) {
  const div = document.createElement('div');
  if (cls) div.className = cls;
  div.textContent = text;
  $('feed').appendChild(div);
  $('feed').scrollTop = $('feed').scrollHeight;
}

function send() {
  const text = $('text').value.trim();
  if (!text || !ws) return;
  ws.send(JSON.stringify({ type: 'instruction', text }));
  $('text').value = '';
}
</script>
</body>
</html>
